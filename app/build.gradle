plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.myjarvis'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.myjarvis"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Используем только встроенную базовую библиотеку, никакой внешней сети для сборки!
    implementation 'android.os:core:1.0.0'
}
