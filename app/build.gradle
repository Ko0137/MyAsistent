plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.myjarvis'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.myjarvis"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Никаких внешних библиотек — только чистый Android SDK, сборка пройдет мгновенно!
}
